[project]
name = "machina-stream"
version = "0.1.0"
description = "A synthetic factory telemetry and alerting demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "aiokafka==0.14.0",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend", "."]
markers = [
  "asyncio: runs an asynchronous test function",
  "integration: requires the complete Docker Compose stack",
  "recovery: exercises service or dependency interruption",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
