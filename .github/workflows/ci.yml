name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  contracts-and-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install Python dependencies
        run: uv sync --locked --extra dev
      - name: Lint Python
        run: uv run ruff check backend tests
      - name: Check Python formatting
        run: uv run ruff format --check backend tests
      - name: Run API contract tests
        run: uv run pytest tests/unit --strict-markers
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Lint and typecheck web
        run: |
          pnpm --dir web lint
          pnpm --dir web typecheck

  compose-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MACHINA_E2E_PROJECT: machina-stream-ci-${{ github.run_id }}
      MACHINA_API_URL: http://127.0.0.1:18000
      MACHINA_WEB_URL: http://127.0.0.1:3001
      API_HOST_PORT: "18000"
      POSTGRES_HOST_PORT: "15432"
      SIMULATOR_MACHINE_COUNT: "1"
      SIMULATOR_EVENT_INTERVAL_SECONDS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and Python dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev
      - name: Lint Python
        run: uv run ruff check backend tests
      - name: Check Python formatting
        run: uv run ruff format --check backend tests
      - name: Check Compose security contract
        run: python scripts/check_compose_security.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Start isolated Compose stack
        run: >-
          docker compose -p "$MACHINA_E2E_PROJECT" up -d --build --wait --wait-timeout 240
          postgres kafka kafka-init api processor web prometheus grafana
      - name: Run API and Compose integration tests
        run: uv run pytest tests/unit tests/integration --strict-markers -m "integration and not recovery"
      - name: Install Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Run browser dashboard checks
        run: pnpm --dir web test:e2e
      - name: Run outage and recovery tests
        run: uv run pytest tests/integration --strict-markers -m recovery
      - name: Save browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machina-stream-browser-results
          path: web/test-results
          if-no-files-found: ignore
      - name: Capture Compose evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/compose
          docker compose -p "$MACHINA_E2E_PROJECT" ps > artifacts/compose/ps.txt || true
          docker compose -p "$MACHINA_E2E_PROJECT" config --no-interpolate > artifacts/compose/config.yaml || true
          docker compose -p "$MACHINA_E2E_PROJECT" logs --no-color > artifacts/compose/logs.txt || true
      - name: Upload Compose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machina-stream-compose-results
          path: artifacts/compose
          if-no-files-found: ignore
      - name: Stop isolated test stack and remove its volumes
        if: always()
        run: docker compose -p "$MACHINA_E2E_PROJECT" down --volumes --remove-orphans
